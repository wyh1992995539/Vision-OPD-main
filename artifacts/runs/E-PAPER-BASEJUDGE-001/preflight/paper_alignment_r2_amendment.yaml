reason: >-
  Remove three controllable engineering differences discovered after the R1
  smoke run. These changes improve alignment with the public Vision-OPD
  repository recipe; they do not correct a scoring-validity defect.

controlled_differences_removed:
  serving:
    previous: tensor_parallel_size=2, gpu_memory_utilization=0.80, explicit_dtype_and_scheduler_limits
    r2: tensor_parallel_size=1, gpu_memory_utilization=0.75, gdn_prefill_backend=triton
    public_basis: official_repository_serving_command
  zoombench_and_mmstar_images:
    previous: decoded_and_reencoded_as_png_during_frozen_preparation
    r2: preserve_source_image_bytes_exactly_as_official_prepare_data.py
    public_basis: official_repository_prepare_data.py
  vstar_request_images:
    previous: preserve_source_bytes_when_at_or_below_20MiB_then_png_only_if_oversize
    r2: always_decode_convert_to_rgb_and_encode_png_then_downsize_only_if_above_20MiB
    public_basis: official_repository_infer.py

unchanged_protocol:
  model_under_test: Qwen/Qwen3.5-4B
  enable_thinking: false
  temperature: 0
  max_tokens: 1024
  parallel_workers: 16
  full_image_only: true
  official_request_counts:
