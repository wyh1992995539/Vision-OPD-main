  frozen_at_utc: "2026-09-10"
  purpose: apply one correctness-independent output-cap policy to Base, Vision-OPD, and Cached benchmark evaluation
  execution_authorized_now: false
  gpu_required_for_freeze: false
  gpu_inference_started_by_freeze: false

