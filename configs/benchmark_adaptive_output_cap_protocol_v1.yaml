scope:
  roles:
    - base
    - vision_opd
    - cached_prefix
  benchmark_views:
    - zoombench/full
    - mmstar/full
    - vstar/full
  initial_output_cap_tokens: 1024
  selection_predicate: finish_reason_equals_length
  selection_is_role_and_benchmark_specific: true
  samples_with_non_length_finish_reason_are_never_regenerated: true

adaptive_schedule:
  stages:
    - max_tokens: 2048
      workers: 16
    - max_tokens: 4096
      workers: 16
    - max_tokens: 8192
      workers: 8
    - max_tokens: 16384
      workers: 4
    - max_tokens: 32768
      workers: 2
    - max_tokens: 65536
      workers: 1
    - max_tokens: 131072
      workers: 1
  request_timeout_seconds: 14400
  next_stage_predicate: previous_stage_finish_reason_equals_length
  stop_for_sample: first_non_length_finish_reason
  correctness_must_not_control_retry_or_stage_selection: true
  best_of_or_oracle_selection_forbidden: true

invariants:
  preserve_for_each_role:
    - exact_checkpoint_and_manifest
    - dataset_revision_and_sample_uid
    - prompt_and_image_payload
    - chat_template
    - enable_thinking_false
    - temperature_zero
    - tensor_parallel_size_one
    - gpu_memory_utilization_0_75
    - gdn_prefill_backend_triton
    - parser_revision_4
    - frozen_qwen3_5_4b_base_judge
  replace_only_selected_length_samples: true
  select_highest_completed_stage_without_using_correctness: true
  preserve_every_attempt_and_sha256: true
  source_predictions_and_scores_are_immutable: true

scoring:
  mmstar_and_vstar: r4_deterministic_mcq_parser_then_frozen_base_judge_for_ambiguous_only
  zoombench: preserve_frozen_r3_mathruler_and_judge_contract
  judge_checkpoint: /root/autodl-tmp/models/Qwen3.5-4B
  judge_output_contract: exactly_yes_or_no
  judge_or_inference_error_policy: unresolved_and_block_completion
  no_manual_score_edits: true

terminal_degeneracy:
  safety_cap_tokens: 131072
  minimum_duplicate_normalized_paragraph_ratio: 0.95
  required_evidence:
    - finish_reason_length_at_safety_cap
    - complete_attempt_trace
    - benchmark_scorer_or_judge_has_finalized_without_error
    - repeated_generation_evidence_meets_frozen_threshold
  disposition: terminal_generation_degeneracy
  score_policy: retain_benchmark_score_without_oracle_correction
  preserve_raw_finish_reason_length: true
  unresolved_output_cap: false
  if_required_evidence_fails: keep_protocol_incomplete_and_freeze_an_amendment_before_any_new_action

reporting:
  keep_historical_r3_and_r4_results: true
  report_columns:
    - raw_r4_correct
    - raw_r4_accuracy
    - raw_finish_reason_length_count
    - adaptive_final_correct
    - adaptive_final_accuracy
    - natural_stop_after_regeneration_count
    - terminal_generation_degeneracy_count
    - unresolved_output_cap_count
    - judge_error_count
    - inference_error_count
  primary_internal_result_requires_unresolved_output_cap_count_zero: true
  paper_comparability_label: not_exact_paper_reproduction_due_to_local_base_judge

