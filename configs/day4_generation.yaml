schema_version: 1

experiment:
  id: E-D4-001
  base_model_path: /root/autodl-tmp/models/Qwen3.5-4B
  base_model_sha256_file: artifacts/runs/E-D4-001/base_model_sha256.txt
  seed: 42

serving:
  served_model_name: vision-opd-base
  tensor_parallel_size: 2
  distributed_executor_backend: mp
  dtype: bfloat16
  max_model_len: 8192
  max_num_seqs: 8
  gpu_memory_utilization: 0.80
  limit_mm_per_prompt:
    image: 1
    video: 0

shared:
  prompt_column: prompt
  student_image_key: images
  forbidden_model_inputs:
    - bbox_images
    - reward_model.ground_truth

  chat_template:
    file: chat_templates/perception_chat_template_qwen35.jinja
    add_generation_prompt: true
    enable_thinking: false
    record_template_sha256: true

  output:
    keep_raw_text: true
    keep_finish_reason: true
    keep_response_token_ids: true
    exclude_prompt_token_ids: true
    exclude_padding_token_ids: true
    keep_eos_token: true

evaluation:
  input_parquet: /root/autodl-tmp/data/vision_opd_1024/eval_128.parquet
  expected_samples: 128
  output_dir: artifacts/runs/E-D4-001/eval

  generation:
    num_return_sequences: 1
    do_sample: false
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_new_tokens: 256
    seed: 42
    stop: tokenizer_eos_only

cached_prefix:
  input_parquet: /root/autodl-tmp/data/vision_opd_1024/train_1024.parquet
  expected_samples: 1024
  output_parquet: /root/autodl-tmp/data/vision_opd_1024/cached_prefix_base_1024.parquet
  report_file: /root/autodl-tmp/data/vision_opd_1024/manifests/cached_prefix_report.json
  sha256_file: /root/autodl-tmp/data/vision_opd_1024/manifests/cached_prefix_sha256.txt

  generation:
    num_return_sequences: 1
    do_sample: true
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    max_new_tokens: 256
    seed: 42
    stop: tokenizer_eos_only
