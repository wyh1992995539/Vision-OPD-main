schema_version: 2

project:
  name: vision-opd-qwen35-4b-1024
  freeze_date: "2026-08-20"
  scope_amendment_date: "2026-08-24"
  scope_amendment: remove-sft-add-external-benchmarks
  execution_sync_date: "2026-08-25"
  followup_gate_amendment: add-post-day5-comparability-gates
  benchmark_sync_date: "2026-08-27"
  benchmark_governance_amendment: artifacts/runs/E-PAPER-BASEJUDGE-001/preflight/benchmark_governance_sync_amendment.yaml
  plan: docs/vision_opd_21_day_plan.md
  freeze_document: docs/project_freeze.md
  seed: 42
  scope: small-scale-4b-1024-vopd-cached-grpo-controlled-comparison

reproducibility:
  master_seed: 42
  data_split_seed: 42
  dataloader_seed: 42
  training_seed: 42
  rollout_seed: 42
  require_explicit_seed_in_experiment_configs: true
  deterministic_split_required: true
  note: "project_1024.yaml 不会被训练器自动继承；各实验配置和启动脚本必须显式传入 42。"

model:
  name: Qwen3.5-4B
  path: /root/autodl-tmp/models/Qwen3.5-4B
  role: shared-base-checkpoint
  weight_format: safetensors
  expected_weight_shards: 2
  require_preflight_sha256: true
  branch_policy:
    vision_opd_starts_from_base: true
    cached_prefix_starts_from_base: true
    grpo_starts_from_base: true
    forbid_serial_inheritance: true

data:
  source: yuanqianhao/Vision-OPD-6K
  source_revision: eb5c1c2e7b9a7b6a619efe4161c7369c71bf8af4
  source_metadata:
    file: train.jsonl
    local_path: D:/VisionOPD-data/raw_meta/train.jsonl
    sha256: 8ad2fb81da0f6fba1766545dc5f84cc2250e48704738757461b2d75aa31821df
    record_count: 6241
    byte_size: 4566587
  split_once: true
  grouping_rule: original_image_or_question_group
  forbid_cross_split_source_leakage: true
  require_stable_sample_id: true
  preserve_original_source_id: true

  splits:
    train:
      size: 1024
      usage:
        - vision_opd
        - cached_prefix
        - grpo_verifiable_subset
    eval:
      size: 128
      usage:
        - internal_main_evaluation
      forbidden_during_training: true
    retention:
      size: 64
      usage:
        - internal_same_distribution_retention
        - format_retention
      interpretation: internal_only_not_external_general_capability

  required_fields:
    - sample_id
    - source_id
    - split
    - question
    - answer
    - question_type
    - full_image_path
    - crop_image_path
    - bbox

  manifests:
    candidate: artifacts/data/candidate_manifest.jsonl
    split: artifacts/data/split_manifest.json
    candidate_statistics: artifacts/data/candidate_stats.json
    train_jsonl: artifacts/data/train_1024.jsonl
    eval_jsonl: artifacts/data/eval_128.jsonl
    retention_jsonl: artifacts/data/retention_64.jsonl
    cached_prefix: artifacts/data/cached_prefix_base_1024.parquet

  frozen_outputs:
    train: artifacts/data/train_1024.parquet
    eval: artifacts/data/eval_128.parquet
    retention: artifacts/data/retention_64.parquet
    statistics: artifacts/data/data_stats.json
    manual_qa: artifacts/data/manual_qa_30.jsonl
    sha256: artifacts/data/data_sha256.txt

evaluation:
  protocol_layers:
    development:
      datasets:
        - eval_128
        - retention_64
      purpose: fast_regression_paired_analysis_and_internal_retention
    final:
      datasets:
        - zoombench
        - mmstar
        - vstar
      purpose: fine_grained_external_and_general_capability_evaluation
      final_checkpoints_only: true
      base_evaluated_once: true
      forbid_hyperparameter_tuning_on_results: true

  shared_eval_manifest: artifacts/data/eval_128.parquet
  shared_retention_manifest: artifacts/data/retention_64.parquet
  evaluator_version_file: artifacts/eval/evaluator_version.json
  save_per_sample_predictions: true
  unsupported_policy: mark_unsupported
  forbid_forced_scoring: true
  generation:
    enable_thinking: false
    temperature: 0
    max_tokens: 1024
    parameters_frozen_by_protocol_revision: 3
  external:
    protocol_document: docs/benchmark_protocol.md
    config: configs/benchmark_eval_paper_basejudge_r3_single_gpu.yaml
    config_sha256: e71255e817b11c120b4ac22d7ace81d12ffe01e25f7ea94de2e2ffb62e592903
    protocol_revision: 3
    protocol_status: sole_active_standard
    protocol_freeze_day: 6
    base_evaluation_day: 6
    base_run_manifest: artifacts/runs/E-PAPER-BASEJUDGE-001/base/run_manifest.json
    base_validation: artifacts/runs/E-PAPER-BASEJUDGE-001/base/validation.json
    require_formal_comparability_gate: true
    failed_or_invalid_sample_policy: count_incorrect_and_record_failure
    include_failed_samples_in_official_denominator: true
    benchmarks:
      - zoombench
      - mmstar
      - vstar
    preserve_official_split: true
    save_dataset_revision_and_sha256: true
    require_exact_hash_overlap_audit: true
    require_question_overlap_audit: true
    require_perceptual_hash_overlap_audit: true
    forbid_silent_sample_removal: true
    freeze_judge_model_prompt_and_parameters: true
    save_judge_source_per_sample: true
    require_training_design_lock_before_base_full_results: true
    training_design_lock_artifact: artifacts/runs/E-D6-001/preflight/training_design_lock.yaml
    forbid_external_scores_before_training_design_lock: true
    vision_opd_external_evaluation_day: 18
    cached_prefix_external_evaluation_day: 18
    judge_identity:
      role: frozen_original_qwen35_4b_base
      forbid_trained_checkpoint_as_judge: true
      require_checkpoint_sha256: true
    judge_calibration:
      status: historical_e_d6_only
      required_before_day6: true
      minimum_human_labeled_pairs: 32
      minimum_agreement: 0.90
      reject_on_systematic_base_expression_bias: true
      failure_policy: human_review_or_report_separately
      records: artifacts/runs/E-D6-001/preflight/judge_calibration.jsonl
      summary: artifacts/runs/E-D6-001/preflight/judge_calibration_summary.json

hardware:
  node_count: 1
  gpu_count: 2
  gpu_model: NVIDIA RTX PRO 6000 Blackwell Server Edition
  memory_gb_per_gpu: 96
  gpu_per_node: 2
  current_dual_gpu_verified: true
  external_evaluation_gpu_count: 1
  external_evaluation_tensor_parallel_size: 1
  verification_status: pass
  must_verify_before_gpu_smoke: true
  verification_artifact: artifacts/runs/preflight/hardware.txt

budget:
  currency: CNY
  cost_per_gpu_hour: 5.98
  cost_per_dual_gpu_hour: 11.96
  hard_limit: 2000
  hard_limit_dual_gpu_hours: 167
  estimate_status: r3_base_measured_client_stages_only
  r3_instance_cost_per_wall_hour_cny: 5.98
  r3_base_client_observed_cny: 1.2865629854277778
  r3_base_cost_excludes: model_server_startup_shutdown_and_idle_time
  legacy_e_d6_full_external_eval_conservative_cny_per_model: 43.18
  legacy_e_d6_full_external_eval_worst_case_cny_per_model: 71.70
  legacy_e_d6_pause_checkpoint_cny: 80
  legacy_e_d6_single_run_stop_cny: 100
  removed_training_branch: sft
  freeze_external_evaluation_budget_after_day5_smoke: true
  require_pre_run_cost_estimate: true

storage:
  system_disk_for_large_artifacts: false
  data_root: /root/autodl-tmp
  model_path: /root/autodl-tmp/models/Qwen3.5-4B
  artifact_root: artifacts
  checkpoint_root: /root/autodl-tmp/checkpoints
  cache_paths:
    hf_home: /root/autodl-tmp/hf_cache
    torch_home: /root/autodl-tmp/torch_cache
    pip_cache_dir: /root/autodl-tmp/pip_cache
    tmpdir: /root/autodl-tmp/tmp

  data_acquisition:
    strategy: off_machine_extract_then_upload
    decision_status: confirmed
    server_current_total_gb: 50
    minimum_free_gb_before_raw_download: 45
    raw_download_on_server_allowed: false
    upload_frozen_subset_only: true
    required_upload_contents:
      - frozen_1024_128_64_subset
      - manifests_stats_manual_qa
      - sha256
    verify_server_disk_after_upload: true
    remove_raw_package_after_subset_freeze: true

  benchmark_data:
    size_preflight_required: true
    download_only_after_protocol_selection: true
    store_under_data_root: true
    preserve_revision_and_hash_manifests: true
    cleanup_only_after_prepared_data_verification: true

  checkpoint_policy:
    keep_current_experiment_only: true
    keep_many_step_checkpoints: false
    delete_shards_only_after_merge_load_test_and_sha256: true
    forbid_deleting_unique_unverified_model: true

experiments:
  vanilla_internal:
    id: E-D4-001
    starts_from: base
    evaluation_suite: internal_eval_128
    status: pass
  benchmark_smoke:
    id: E-D5-001
    starts_from: base
    evaluation_suite:
      - zoombench_smoke_16
      - mmstar_smoke_16
      - vstar_smoke_16
    status: pass
  vanilla_external_legacy:
    id: E-D6-001
    status: archived_engineering_diagnostic
    allow_primary_comparison: false
    starts_from: base
    evaluation_suite:
      - zoombench
      - mmstar
      - vstar
  paper_aligned_base_external:
    id: E-PAPER-BASEJUDGE-001
    role: base
    status: pass
    protocol_revision: 3
    output_dir: artifacts/runs/E-PAPER-BASEJUDGE-001/base
    validation: artifacts/runs/E-PAPER-BASEJUDGE-001/base/validation.json
  vision_opd_smoke:
    id: E-D7-001
    starts_from: base
    prefix_source: online
  vision_opd_stability:
    id: E-D8-001
    starts_from: base
    prefix_source: online
  vision_opd_train:
    id: E-D10-001
    starts_from: base
    prefix_source: online
  vision_opd_final_evaluation:
    id: E-D12-001
    checkpoint_from: E-D10-001
    evaluation_suite:
      - internal_eval_128
      - internal_retention_64
    freeze_checkpoint_before_external_results: true
  cached_prefix_contract:
    id: E-D14-001
    starts_from: base
    prefix_source: cached
    cached_token_provenance: base_tokenizer_reencoded_openai_response_text
    strict_single_variable_label_requires_contract_pass: true
    failure_label: implementation_ablation
    required_equal_contract_fields:
      - base_checkpoint_sha256
      - chat_template_sha256
      - processor_identity
      - student_image_input
      - sampling_parameters
      - eos_and_stop_policy
      - prompt_token_ids
      - response_decode_encode_roundtrip
      - response_mask
      - padding_policy
  cached_prefix_stability:
    id: E-D15-001
    starts_from: base
    prefix_source: cached
  cached_prefix_train:
    id: E-D16-001
    starts_from: base
    prefix_source: cached
  cached_prefix_final_evaluation:
    id: E-D18-001
    checkpoint_from: E-D16-001
    evaluation_suite:
      - internal_eval_128
      - internal_retention_64
    freeze_checkpoint_before_external_results: true
  final_branch_external_evaluation:
    id: E-D18-002
    checkpoint_from:
      - E-D10-001
      - E-D16-001
    require_both_internal_results_frozen: true
    evaluation_suite:
      - zoombench
      - mmstar
      - vstar

  grpo_pilot_32:
    id: E-D23-001
    starts_from: base
  grpo_pilot_64:
    id: E-D24-001
    starts_from: base
  grpo_train:
    id: E-D25-001
    starts_from: base
  grpo_final_evaluation:
    id: E-D28-001
    checkpoint_from: E-D25-001
    evaluation_suite:
      - internal_eval_128
      - internal_retention_64
      - zoombench
      - mmstar
      - vstar

future_gates:
  server_test_entry:
    command: conda run -n vision-opd python -m pytest -q
    required_imports:
      - openai
      - yaml
      - torch
  multimodal_prompt_length:
    gate_day: 7
    measure_with_training_processor: true
    measure_on_train_1024: true
    required_percentiles:
      - p50
      - p95
      - p99
      - max
    starting_candidate: 8192
    forbid_default_4096: true
    forbid_silent_truncation: true
    smoke_overlength_count_required: 0
  tracked_text_hashing:
    canonical_newline: lf
    algorithm: sha256
    tracked_extensions:
      - md
      - yaml
      - json
      - jsonl
      - txt
    binary_files_use_raw_bytes: true

evidence:
  preflight_dir: artifacts/runs/preflight
  required_preflight_files:
    - README.md
    - git_state.txt
    - working_tree.patch
    - env.txt
    - pip_check.txt
    - hardware.txt
    - disk.txt
    - model_manifest.txt
    - model_sha256.txt
    - storage_decision.md

  required_training_experiment_files:
    - config.yaml
    - command.txt
    - git_commit.txt
    - env.txt
    - train.log
    - metrics.jsonl
    - cost.json
    - checkpoint_sha256.txt
    - eval/predictions.jsonl
    - eval/summary.json

  required_evaluation_experiment_files:
    - run_manifest.json
    - predictions.jsonl
    - judge_results.jsonl
    - scores.jsonl
    - summary.json
    - resume_status.json
    - metrics.json
    - cost.json
    - artifact_sha256.txt
    - validation.json
    - summary.json
    - cost.json
