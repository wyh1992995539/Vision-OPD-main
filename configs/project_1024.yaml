schema_version: 2

project:
  name: vision-opd-qwen35-4b-1024
  freeze_date: "2026-08-20"
  scope_amendment_date: "2026-08-24"
  scope_amendment: remove-sft-add-external-benchmarks
  plan: docs/vision_opd_21_day_plan.md
  freeze_document: docs/project_freeze.md
  seed: 42
  scope: small-scale-4b-1024-vopd-cached-grpo-controlled-comparison

reproducibility:
  master_seed: 42
  data_split_seed: 42
  dataloader_seed: 42
  training_seed: 42
  rollout_seed: 42
  require_explicit_seed_in_experiment_configs: true
  deterministic_split_required: true
  note: "project_1024.yaml 不会被训练器自动继承；各实验配置和启动脚本必须显式传入 42。"

model:
  name: Qwen3.5-4B
  path: /root/autodl-tmp/models/Qwen3.5-4B
  role: shared-base-checkpoint
  weight_format: safetensors
  expected_weight_shards: 2
  require_preflight_sha256: true
  branch_policy:
    vision_opd_starts_from_base: true
    cached_prefix_starts_from_base: true
    grpo_starts_from_base: true
    forbid_serial_inheritance: true

data:
  source: yuanqianhao/Vision-OPD-6K
  source_revision: eb5c1c2e7b9a7b6a619efe4161c7369c71bf8af4
  source_metadata:
    file: train.jsonl
    local_path: D:/VisionOPD-data/raw_meta/train.jsonl
    sha256: 8ad2fb81da0f6fba1766545dc5f84cc2250e48704738757461b2d75aa31821df
    record_count: 6241
    byte_size: 4566587
  split_once: true
  grouping_rule: original_image_or_question_group
  forbid_cross_split_source_leakage: true
  require_stable_sample_id: true
  preserve_original_source_id: true

  splits:
    train:
      size: 1024
      usage:
        - vision_opd
        - cached_prefix
        - grpo_verifiable_subset
    eval:
      size: 128
      usage:
        - internal_main_evaluation
      forbidden_during_training: true
    retention:
      size: 64
      usage:
        - internal_same_distribution_retention
        - format_retention
      interpretation: internal_only_not_external_general_capability

  required_fields:
    - sample_id
    - source_id
    - split
    - question
    - answer
    - question_type
    - full_image_path
    - crop_image_path
    - bbox

  manifests:
    candidate: artifacts/data/candidate_manifest.jsonl
    split: artifacts/data/split_manifest.json
    candidate_statistics: artifacts/data/candidate_stats.json
    train_jsonl: artifacts/data/train_1024.jsonl
    eval_jsonl: artifacts/data/eval_128.jsonl
    retention_jsonl: artifacts/data/retention_64.jsonl
    cached_prefix: artifacts/data/cached_prefix_base_1024.parquet

  frozen_outputs:
    train: artifacts/data/train_1024.parquet
    eval: artifacts/data/eval_128.parquet
    retention: artifacts/data/retention_64.parquet
    statistics: artifacts/data/data_stats.json
    manual_qa: artifacts/data/manual_qa_30.jsonl
    sha256: artifacts/data/data_sha256.txt

evaluation:
  protocol_layers:
    development:
      datasets:
        - eval_128
        - retention_64
      purpose: fast_regression_paired_analysis_and_internal_retention
    final:
      datasets:
        - zoombench
        - mmstar
        - vstar
      purpose: fine_grained_external_and_general_capability_evaluation
      final_checkpoints_only: true
      base_evaluated_once: true
      forbid_hyperparameter_tuning_on_results: true

  shared_eval_manifest: artifacts/data/eval_128.parquet
  shared_retention_manifest: artifacts/data/retention_64.parquet
  evaluator_version_file: artifacts/eval/evaluator_version.json
  save_per_sample_predictions: true
  unsupported_policy: mark_unsupported
  forbid_forced_scoring: true
  generation:
    temperature: 0
    parameters_frozen_on_day: 4
  external:
    protocol_document: docs/benchmark_protocol.md
    config: configs/benchmark_eval.yaml
    protocol_freeze_day: 5
    base_evaluation_day: 6
    benchmarks:
      - zoombench
      - mmstar
      - vstar
    preserve_official_split: true
    save_dataset_revision_and_sha256: true
    require_exact_hash_overlap_audit: true
    require_question_overlap_audit: true
    require_perceptual_hash_overlap_audit: true
    forbid_silent_sample_removal: true
    freeze_judge_model_prompt_and_parameters: true
    save_judge_source_per_sample: true

hardware:
  node_count: 1
  gpu_count: 2
  gpu_model: NVIDIA RTX PRO 6000 Blackwell Server Edition
  memory_gb_per_gpu: 96
  gpu_per_node: 2
  current_dual_gpu_verified: true
  verification_status: pass
  must_verify_before_gpu_smoke: true
  verification_artifact: artifacts/runs/preflight/hardware.txt

budget:
  currency: CNY
  cost_per_gpu_hour: 5.98
  cost_per_dual_gpu_hour: 11.96
  hard_limit: 2000
  hard_limit_dual_gpu_hours: 167
  estimate_status: pending_day5_benchmark_smoke_and_branch_throughput
  removed_training_branch: sft
  freeze_external_evaluation_budget_after_day5_smoke: true
  require_pre_run_cost_estimate: true

storage:
  system_disk_for_large_artifacts: false
  data_root: /root/autodl-tmp
  model_path: /root/autodl-tmp/models/Qwen3.5-4B
  artifact_root: artifacts
  checkpoint_root: /root/autodl-tmp/checkpoints
  cache_paths:
    hf_home: /root/autodl-tmp/hf_cache
    torch_home: /root/autodl-tmp/torch_cache
    pip_cache_dir: /root/autodl-tmp/pip_cache
    tmpdir: /root/autodl-tmp/tmp

  data_acquisition:
    strategy: off_machine_extract_then_upload
    decision_status: confirmed
    server_current_total_gb: 50
    minimum_free_gb_before_raw_download: 45
    raw_download_on_server_allowed: false
    upload_frozen_subset_only: true
    required_upload_contents:
      - frozen_1024_128_64_subset
      - manifests_stats_manual_qa
      - sha256
    verify_server_disk_after_upload: true
    remove_raw_package_after_subset_freeze: true

  benchmark_data:
    size_preflight_required: true
    download_only_after_protocol_selection: true
    store_under_data_root: true
    preserve_revision_and_hash_manifests: true
    cleanup_only_after_prepared_data_verification: true

  checkpoint_policy:
    keep_current_experiment_only: true
    keep_many_step_checkpoints: false
    delete_shards_only_after_merge_load_test_and_sha256: true
    forbid_deleting_unique_unverified_model: true

experiments:
  vanilla_internal:
    id: E-D4-001
    starts_from: base
    evaluation_suite: internal_eval_128
    status: pass
  benchmark_smoke:
    id: E-D5-001
    starts_from: base
    evaluation_suite:
      - zoombench_smoke_16
      - mmstar_smoke_16
      - vstar_smoke_16
  vanilla_external:
    id: E-D6-001
    starts_from: base
    evaluation_suite:
      - zoombench
      - mmstar
      - vstar
  vision_opd_smoke:
    id: E-D7-001
    starts_from: base
    prefix_source: online
  vision_opd_stability:
    id: E-D8-001
    starts_from: base
    prefix_source: online
  vision_opd_train:
    id: E-D10-001
    starts_from: base
    prefix_source: online
  vision_opd_final_evaluation:
    id: E-D12-001
    checkpoint_from: E-D10-001
    evaluation_suite:
      - internal_eval_128
      - internal_retention_64
      - zoombench
      - mmstar
      - vstar
  cached_prefix_contract:
    id: E-D14-001
    starts_from: base
    prefix_source: cached
  cached_prefix_stability:
    id: E-D15-001
    starts_from: base
    prefix_source: cached
  cached_prefix_train:
    id: E-D16-001
    starts_from: base
    prefix_source: cached
  cached_prefix_final_evaluation:
    id: E-D18-001
    checkpoint_from: E-D16-001
    evaluation_suite:
      - internal_eval_128
      - internal_retention_64
      - zoombench
      - mmstar
      - vstar
  grpo_pilot_32:
    id: E-D23-001
    starts_from: base
  grpo_pilot_64:
    id: E-D24-001
    starts_from: base
  grpo_train:
    id: E-D25-001
    starts_from: base
  grpo_final_evaluation:
    id: E-D28-001
    checkpoint_from: E-D25-001
    evaluation_suite:
      - internal_eval_128
      - internal_retention_64
      - zoombench
      - mmstar
      - vstar

evidence:
  preflight_dir: artifacts/runs/preflight
  required_preflight_files:
    - README.md
    - git_state.txt
    - working_tree.patch
    - env.txt
    - pip_check.txt
    - hardware.txt
    - disk.txt
    - model_manifest.txt
    - model_sha256.txt
    - storage_decision.md

  required_training_experiment_files:
    - config.yaml
    - command.txt
    - git_commit.txt
    - env.txt
    - train.log
    - metrics.jsonl
    - cost.json
    - checkpoint_sha256.txt
    - eval/predictions.jsonl
    - eval/summary.json

  required_evaluation_experiment_files:
    - protocol.yaml
    - command.txt
    - git_commit.txt
    - env.txt
    - model_sha256.txt
    - dataset_revision_sha256.json
    - predictions.jsonl
    - judge_details.jsonl
    - summary.json
    - cost.json
